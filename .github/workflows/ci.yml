name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  test-backend:
    name: Testes Backend
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'
          cache-dependency-path: Backend/package-lock.json

      - name: Instalar dependências
        run: npm ci
        working-directory: Backend

      - name: Rodar testes
        run: npm test
        working-directory: Backend
        env:
          JWT_SECRET: test_secret_ci
          DB_HOST: localhost
          DB_USER: root
          DB_PASSWORD: ''
          DB_NAME: agenda_medica

  test-frontend:
    name: Testes Frontend
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'
          cache-dependency-path: Frontend/package-lock.json

      - name: Instalar dependências
        run: npm ci
        working-directory: Frontend

      - name: Rodar testes
        run: npm test
        working-directory: Frontend
